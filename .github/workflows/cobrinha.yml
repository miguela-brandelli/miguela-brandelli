name: generate animation

on:
 # run automatically every 24 hours
 schedule:
   - cron: "0 */24 * * *" 
 
 # allows to manually run the job at any time
 workflow_dispatch:
 
 # run on every push on the main branch
 push:
   branches:
   - main
   
 

jobs:
 generate:
   runs-on: ubuntu-latest
   timeout-minutes: 10
   
   steps:
     # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
     - name: generate github-contribution-grid-snake.svg
       uses: Platane/snk/svg-only@v3
       with:
         github_user_name: miguela-brandelli
         outputs: |
           dist/github-contribution-grid-snake.svg
           dist/github-contribution-grid-snake-dark.svg?palette=github-dark
       env:
         GITHUB_TOKEN: ${{ secrets.SNK_TOKEN }}
         
         
     # cards generated with your own token (user-approved), actions pinned to commit SHAs
     - name: generate stats card
       uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
       with:
         card: stats
         options: username=miguela-brandelli&theme=tokyonight&hide_border=true
         path: dist/stats.svg
         token: ${{ secrets.SNK_TOKEN }}

     - name: generate top languages card
       uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
       with:
         card: top-langs
         options: username=miguela-brandelli&theme=tokyonight&hide_border=true&layout=compact
         path: dist/top-langs.svg
         token: ${{ secrets.SNK_TOKEN }}

     - name: generate streak card
       uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1.8.0
       with:
         options: user=miguela-brandelli&theme=tokyonight&hide_border=true
         path: dist/streak.svg
         token: ${{ secrets.SNK_TOKEN }}

     # push the content of <build_dir> to a branch
     # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
     - name: push github-contribution-grid-snake.svg to the output branch
       uses: crazy-max/ghaction-github-pages@v3.1.0
       with:
         target_branch: output
         build_dir: dist
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
